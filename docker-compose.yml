version: '3.8'

services:
  api:
    build: .
    container_name: nifty100_api
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=data/nifty100.db
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  dashboard:
    build: .
    container_name: nifty100_dashboard
    ports:
      - "8501:8501"
    environment:
      - DB_PATH=data/nifty100.db
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./reports:/app/reports
