version: 1
disable_existing_loggers: False
formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
loggers:
  etl:
    level: INFO
    handlers: [console]
    propagate: no
  analytics:
    level: INFO
    handlers: [console]
    propagate: no
  api:
    level: INFO
    handlers: [console]
    propagate: no
root:
  level: INFO
  handlers: [console]
