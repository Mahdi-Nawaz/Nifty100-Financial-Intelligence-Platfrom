# Screener Configuration Reference (Deliverable D-08)
# Analyst-configurable thresholds and presets

presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE, low debt, consistently cash-generative, and double-digit revenue growth"
    ranking_metric: "composite_score"
    ranking_ascending: false
    filters:
      min_roe: 15.0
      max_de: 1.0
      min_fcf: 0.0
      min_rev_cagr_5yr: 10.0

  value_pick:
    name: "Value Pick"
    description: "Undervalued stocks with moderate debt and attractive dividend yield"
    ranking_metric: "fcf_yield"
    ranking_ascending: false
    filters:
      max_pe: 20.0
      max_pb: 3.0
      max_de: 2.0
      min_div_yield: 1.0

  growth_accelerator:
    name: "Growth Accelerator"
    description: "Rapidly expanding companies with strong bottom-line and top-line momentum"
    ranking_metric: "pat_cagr_5yr"
    ranking_ascending: false
    filters:
      min_pat_cagr_5yr: 20.0
      min_rev_cagr_5yr: 15.0
      max_de: 2.0

  dividend_champion:
    name: "Dividend Champion"
    description: "High yielding companies with sustainable payout and positive cash generation"
    ranking_metric: "dividend_yield_pct"
    ranking_ascending: false
    filters:
      min_div_yield: 2.0
      max_payout: 80.0
      min_fcf: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero-borrowing large-caps with double-digit returns on equity"
    ranking_metric: "return_on_equity_pct"
    ranking_ascending: false
    filters:
      max_de: 0.0
      min_roe: 12.0
      min_sales: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Rebounding companies with reviving revenue growth and positive cash flow"
    ranking_metric: "revenue_cagr_3yr"
    ranking_ascending: false
    filters:
      min_rev_cagr_3yr: 10.0
      min_fcf: 0.0

weights:
  profitability: 0.35
  cash_quality: 0.30
  growth: 0.20
  leverage: 0.15
