<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Ambient Glow -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients for Geometry -->
    <linearGradient id="primaryCyanTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06D6A0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="trendArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="navyPillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern for Quant Aesthetic -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="800" rx="48" fill="#0A0F1D" />

  <!-- Outer Circular Shield Badge -->
  <circle cx="400" cy="400" r="350" fill="url(#bgGradient)" stroke="url(#badgeBorder)" stroke-width="3" />
  
  <!-- Subtle Quant Data Matrix Overlay inside circle -->
  <circle cx="400" cy="400" r="348" fill="url(#grid)" />

  <!-- Ambient Color Aura Behind Logo -->
  <circle cx="420" cy="330" r="160" fill="#00F5D4" opacity="0.08" filter="url(#ambientGlow)" />
  <circle cx="360" cy="380" r="140" fill="#3B82F6" opacity="0.10" filter="url(#ambientGlow)" />

  <!-- ================= LOGO ICON GEOMETRY ================= -->
  <g transform="translate(0, -25)">

    <!-- Stylized Monogram N Left Pillar (Hollow Sleek Tech Bar) -->
    <path d="M 285 240 L 335 240 L 335 480 L 285 480 Z" 
          fill="none" stroke="url(#primaryCyanTeal)" stroke-width="16" stroke-linejoin="round" />
    <path d="M 285 240 L 335 240 L 335 480 L 285 480 Z" 
          fill="#0F172A" opacity="0.65" />

    <!-- Stylized Monogram N Right Pillar -->
    <path d="M 465 240 L 515 240 L 515 480 L 465 480 Z" 
          fill="none" stroke="url(#navyPillarGrad)" stroke-width="16" stroke-linejoin="round" />
    <path d="M 465 240 L 515 240 L 515 480 L 465 480 Z" 
          fill="#0F172A" opacity="0.65" />

    <!-- Connecting Dynamic Quantum Network Lines -->
    <g stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="3,3">
      <line x1="270" y1="460" x2="360" y2="400" />
      <line x1="360" y1="400" x2="430" y2="440" />
      <line x1="430" y1="440" x2="525" y2="310" />
      <line x1="360" y1="400" x2="480" y2="340" />
    </g>

    <!-- Upward Exponential Trendline & Arrow (Through the N) -->
    <g filter="url(#neonGlow)">
      <!-- Candlestick / Volume Accent Bars Behind Trendline -->
      <line x1="380" y1="450" x2="380" y2="380" stroke="#10B981" stroke-width="5" opacity="0.35" stroke-linecap="round" />
      <line x1="420" y1="440" x2="420" y2="330" stroke="#38BDF8" stroke-width="5" opacity="0.35" stroke-linecap="round" />
      <line x1="460" y1="410" x2="460" y2="280" stroke="#60A5FA" stroke-width="5" opacity="0.35" stroke-linecap="round" />

      <!-- Main Rising Alpha Polyline -->
      <polyline points="265,475 350,385 415,445 540,245" 
                fill="none" 
                stroke="url(#trendArrowGrad)" 
                stroke-width="18" 
                stroke-linecap="round" 
                stroke-linejoin="round" />

      <!-- Arrowhead -->
      <polygon points="565,210 515,235 538,265" 
               fill="#60A5FA" />
      <polygon points="565,210 515,235 530,250" 
               fill="#38BDF8" />
    </g>

    <!-- Data Nodes / Quant Vertices -->
    <!-- Node 1 (Start) -->
    <circle cx="265" cy="475" r="14" fill="#0B132B" stroke="#10B981" stroke-width="6" />
    <circle cx="265" cy="475" r="5" fill="#34D399" />

    <!-- Node 2 (Pivot 1) -->
    <circle cx="350" cy="385" r="12" fill="#0B132B" stroke="#06D6A0" stroke-width="5" />
    <circle cx="350" cy="385" r="4" fill="#6EE7B7" />

    <!-- Node 3 (Dip / Re-accumulation) -->
    <circle cx="415" cy="445" r="13" fill="#0B132B" stroke="#38BDF8" stroke-width="5" />
    <circle cx="415" cy="445" r="5" fill="#BAE6FD" />

    <!-- Node 4 (Sub-node network) -->
    <circle cx="480" cy="340" r="8" fill="#1E293B" stroke="#60A5FA" stroke-width="3" />
    <circle cx="430" cy="440" r="7" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
    <circle cx="525" cy="310" r="9" fill="#1E293B" stroke="#818CF8" stroke-width="3" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- NIFTY 100 Title -->
  <text x="400" y="625" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="10" 
        fill="#FFFFFF">
    NIFTY 100
  </text>

  <!-- Subtitle Tagline -->
  <text x="400" y="670" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#38BDF8">
    FINANCIAL INTELLIGENCE
  </text>

  <!-- Subtle Bottom Status Indicator -->
  <g transform="translate(355, 695)">
    <circle cx="10" cy="10" r="4" fill="#10B981" />
    <text x="24" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="1.5" fill="#94A3B8">QUANT • FORENSIC • DCF</text>
  </g>
</svg>
